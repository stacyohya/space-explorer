<!DOCTYPE html><html><head><meta charset="utf-8"><title>ending render</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="https://unpkg.com/three@0.144.0/build/three.min.js"></script>
<script src="../textures-data.js"></script>
<script>
(function(){
  var W=1920,H=1080, canvas=document.getElementById('c');
  var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,preserveDrawingBuffer:true}); renderer.setPixelRatio(1); renderer.setSize(W,H,false); renderer.outputEncoding=THREE.sRGBEncoding;
  var scene=new THREE.Scene(); var camera=new THREE.PerspectiveCamera(46,W/H,0.1,3000);
  var loader=new THREE.TextureLoader(); var TEX={}; function tex(n){ if(!TEX[n]){ TEX[n]=loader.load(TEXTURE_DATA['textures/'+n]); TEX[n].encoding=THREE.sRGBEncoding; } return TEX[n]; }
  var dotTex=(function(){var sz=64,cv=document.createElement('canvas');cv.width=cv.height=sz;var x=cv.getContext('2d');var g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.4,'rgba(255,255,255,0.8)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,sz,sz);var t=new THREE.CanvasTexture(cv);t.needsUpdate=true;return t;})();
  function glowTex(rgb){ var s=256,cv=document.createElement('canvas');cv.width=cv.height=s;var x=cv.getContext('2d');var g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);g.addColorStop(0,'rgba('+rgb+',1)');g.addColorStop(0.3,'rgba('+rgb+',0.85)');g.addColorStop(1,'rgba('+rgb+',0)');x.fillStyle=g;x.fillRect(0,0,s,s);var t=new THREE.CanvasTexture(cv);t.needsUpdate=true;return t;}
  function sprite(rgb,scale,op){ var s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(rgb),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:op==null?1:op}));s.scale.set(scale,scale,1);return s;}
  // starfield
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(900,48,32),new THREE.MeshBasicMaterial({map:tex('2k_stars_milky_way.jpg'),side:THREE.BackSide})));
  (function(){var n=2500,p=new Float32Array(n*3);for(var i=0;i<n;i++){var r=300+Math.random()*500,th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(ph)*Math.cos(th);p[i*3+1]=r*Math.sin(ph)*Math.sin(th);p[i*3+2]=r*Math.cos(ph);}var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:1.2,map:dotTex,alphaTest:0.02,transparent:true,opacity:0.9})));})();
  // sun
  var sun=new THREE.Mesh(new THREE.SphereGeometry(5,64,48),new THREE.MeshBasicMaterial({map:tex('2k_sun.jpg')}));scene.add(sun);
  var shimmer=new THREE.Mesh(new THREE.SphereGeometry(5.02,64,48),new THREE.MeshBasicMaterial({map:tex('2k_sun.jpg'),transparent:true,opacity:0.35,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(shimmer);
  var corona=[sprite('255,205,130',12,0.5),sprite('255,190,110',20,0.26),sprite('255,175,95',38,0.12)];corona.forEach(function(s){scene.add(s);});
  scene.add(new THREE.PointLight(0xffffff,2.2,0,0)); scene.add(new THREE.AmbientLight(0x30364a,0.5));
  var P=[['2k_mercury.jpg',0.42,9,1.2,0.3],['2k_venus_surface.jpg',0.9,12,0.9,1.9],['4k_earth_daymap.jpg',1.0,15.5,0.7,3.4],['4k_mars.jpg',0.55,18.5,0.55,5.0],['2k_jupiter.jpg',2.6,24,0.35,0.9],['2k_saturn.jpg',2.2,29,0.28,2.6],['2k_uranus.jpg',1.5,33,0.22,4.4],['2k_neptune.jpg',1.45,37,0.18,5.8]];
  var planets=[];P.forEach(function(d){var pv=new THREE.Object3D();pv.rotation.y=d[4];scene.add(pv);var m=new THREE.Mesh(new THREE.SphereGeometry(d[1],48,32),new THREE.MeshStandardMaterial({map:tex(d[0]),roughness:1}));m.position.x=d[2];m.rotation.z=0.15;pv.add(m);
    if(d[0]==='2k_saturn.jpg'){var rg=new THREE.RingGeometry(d[1]*1.35,d[1]*2.3,96);var pos=rg.attributes.position,uv=rg.attributes.uv,v=new THREE.Vector3();for(var i=0;i<pos.count;i++){v.fromBufferAttribute(pos,i);uv.setXY(i,(v.length()-d[1]*1.35)/(d[1]*0.95),0.5);}var ring=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({color:0xe6d3ad,alphaMap:tex('2k_saturn_ring_alpha.png'),transparent:true,side:THREE.DoubleSide,opacity:0.9,depthWrite:false}));ring.rotation.x=Math.PI/2-0.45;m.add(ring);}
    var g=new THREE.Mesh(new THREE.RingGeometry(d[2]-0.03,d[2]+0.03,160),new THREE.MeshBasicMaterial({color:0x3b5773,transparent:true,opacity:0.3,side:THREE.DoubleSide}));g.rotation.x=-Math.PI/2;scene.add(g);planets.push({pv:pv,m:m,sp:d[3]});});
  (function(){var n=2600,p=new Float32Array(n*3);for(var i=0;i<n;i++){var r=20.4+Math.random()*2.3,a=Math.random()*Math.PI*2;p[i*3]=Math.cos(a)*r;p[i*3+1]=(Math.random()-0.5)*0.7;p[i*3+2]=Math.sin(a)*r;}var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xbfb5a8,size:0.09,map:dotTex,alphaTest:0.02,transparent:true,opacity:0.85})));})();
  var vigCv=document.createElement('canvas');vigCv.width=512;vigCv.height=288;(function(){var x=vigCv.getContext('2d');var g=x.createRadialGradient(256,144,140,256,144,330);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.6)');x.fillStyle=g;x.fillRect(0,0,512,288);})();
  var vig=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(vigCv),transparent:true,depthWrite:false,depthTest:false}));vig.renderOrder=998;scene.add(vig);
  function ease(v){v=Math.max(0,Math.min(1,v));return v*v*(3-2*v);}
  var c0=new THREE.Vector3(0,48,88), c1=new THREE.Vector3(0,26,52);
  window.renderFrame=function(t){
    corona.forEach(function(s,i){var k=1+Math.sin(t*(1.3+i*0.4)+i)*0.035;s.scale.set([12,20,38][i]*k,[12,20,38][i]*k,1);});
    sun.rotation.y=t*0.03; shimmer.rotation.y=-t*0.02;
    planets.forEach(function(p){p.pv.rotation.y+=p.sp*0.02;p.m.rotation.y+=0.02;});
    camera.position.copy(c0.clone().lerp(c1,ease(t/2.4))); camera.lookAt(0,0,0); camera.updateProjectionMatrix();
    var d=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);vig.position.copy(camera.position).add(d.multiplyScalar(1.6));var h=2*1.6*Math.tan(camera.fov/2*Math.PI/180);vig.scale.set(h*camera.aspect*1.02,h*1.02,1);
    renderer.render(scene,camera);
  };
  window.captureFrame=function(t){ renderFrame(t); return canvas.toDataURL('image/jpeg',0.93); };
  loader.manager.onLoad=function(){window.__ready=true;}; setTimeout(function(){window.__ready=true;},15000);
})();
</script></body></html>
