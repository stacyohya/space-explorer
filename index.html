<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#03050a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Solar System" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-180.png" />
<link rel="manifest" href="manifest.json" />
<title>Solar System Explorer</title>
<style>
  :root{
    --bg:#03050a;
    --panel:rgba(12,18,32,.82);
    --panel-solid:#0b111f;
    --border:rgba(103,232,249,.28);
    --cyan:#67e8f9;
    --amber:#fbbf24;
    --text:#e8eef7;
    --muted:#8fa1ba;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  #scene-container{position:fixed; inset:0;}
  canvas#c{display:block; width:100%; height:100%; cursor:grab; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  button{touch-action:manipulation;}
  canvas#c.dragging{cursor:grabbing;}

  /* ---------- Loading ---------- */
  #loading{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    transition:opacity .5s ease; text-align:center; padding:20px;
  }
  #loading.hidden{opacity:0; pointer-events:none;}
  #loading .emoji{font-size:52px; animation:float 2.4s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  #loading h1{font-size:18px; letter-spacing:.08em; text-transform:uppercase; color:var(--cyan); margin:0;}
  #loading p{color:var(--muted); font-size:13px; margin:0;}
  #loading .bar{width:220px; height:4px; background:#141b2b; border-radius:4px; overflow:hidden; margin-top:6px;}
  #loading .bar-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--cyan),var(--amber)); transition:width .25s ease;}

  /* ---------- Top HUD ---------- */
  #title-bar{
    position:fixed; top:18px; left:50%; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--border); border-radius:999px;
    padding:9px 22px; font-size:13px; letter-spacing:.04em; z-index:20;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    display:flex; align-items:center; gap:10px; white-space:nowrap;
    box-shadow:0 4px 24px rgba(0,0,0,.35);
  }
  #title-bar .main{font-weight:600;}
  #title-bar .main[hidden]{display:none;}
  #title-bar{max-width:46vw;}
  #title-bar .sub{color:var(--amber); font-weight:600;}

  /* ---------- Scale breadcrumbs (top-left) ---------- */
  #crumbs{
    position:fixed; top:18px; left:18px; z-index:20; display:flex; align-items:center; gap:2px;
    background:var(--panel); border:1px solid var(--border); border-radius:999px; padding:4px 8px 4px 4px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 4px 24px rgba(0,0,0,.35);
    font-size:13px; max-width:calc(100vw - 270px); flex-wrap:nowrap; overflow:hidden;
  }
  #crumbs .sep{color:var(--muted); padding:0 4px; font-size:12px;}
  #crumbs{width:fit-content; width:-moz-fit-content; justify-content:center;}
  #title-bar.below{top:66px;}
  #title-bar{transition:top .2s ease;}
  #crumbs button{
    background:transparent; border:1px solid transparent; color:var(--muted); font-family:inherit; font-size:13px;
    padding:6px 12px; border-radius:999px; cursor:pointer; transition:all .15s ease; white-space:nowrap;
  }
  #crumbs button.link:hover{color:var(--cyan); border-color:var(--border);}
  #crumbs button.current{color:var(--amber); font-weight:700; cursor:default; background:rgba(251,191,36,.10); border-color:rgba(251,191,36,.35);}
  #crumbs button.next{color:#d8ccff; border-color:rgba(201,184,255,.55); background:linear-gradient(135deg,rgba(120,80,255,.28),rgba(12,18,32,.4));}
  #crumbs button.next:hover{filter:brightness(1.25);}

  /* ---------- Language toggle ---------- */
  #lang-toggle{
    position:fixed; top:18px; right:18px; z-index:20; display:flex; gap:2px; padding:3px;
    background:var(--panel); border:1px solid var(--border); border-radius:999px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:0 4px 24px rgba(0,0,0,.35);
  }
  #lang-toggle button{
    background:transparent; border:none; color:var(--muted); font-size:12px; font-weight:600;
    padding:7px 13px; border-radius:999px; cursor:pointer; letter-spacing:.03em; transition:all .15s ease;
    font-family:inherit;
  }
  #lang-toggle button:hover{color:var(--text);}
  #lang-toggle button.active{background:var(--cyan); color:#04202a;}

  /* ---------- Fun facts button ---------- */
  #facts-btn{
    position:fixed; bottom:calc(18px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:20;
    background:linear-gradient(135deg,rgba(251,191,36,.18),rgba(251,191,36,.06));
    border:1px solid rgba(251,191,36,.55); color:var(--amber); font-weight:600;
    border-radius:999px; padding:11px 22px; font-size:14px; cursor:pointer; font-family:inherit;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:0 4px 24px rgba(0,0,0,.35), 0 0 18px rgba(251,191,36,.18);
    transition:all .15s ease; animation:glowpulse 2.4s ease-in-out infinite;
  }
  #facts-btn:hover{filter:brightness(1.2); transform:translateX(-50%) translateY(-1px);}
  #facts-btn[hidden]{display:none;}
  @keyframes glowpulse{0%,100%{box-shadow:0 4px 24px rgba(0,0,0,.35),0 0 14px rgba(251,191,36,.15);}50%{box-shadow:0 4px 24px rgba(0,0,0,.35),0 0 26px rgba(251,191,36,.38);}}

  /* ---------- Overview feature chips ---------- */
  #feature-bar{
    position:fixed; bottom:calc(70px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:20;
    display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:min(92vw, 760px);
  }
  #feature-bar[hidden]{display:none;}
  #feature-bar button[hidden]{display:none;}
  #feature-bar button{
    background:var(--panel); border:1px solid var(--border); color:var(--text); font-family:inherit;
    border-radius:999px; padding:7px 13px; font-size:12px; cursor:pointer; transition:all .15s ease;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); white-space:nowrap;
  }
  #feature-bar button:hover{border-color:var(--cyan); color:var(--cyan); transform:translateY(-1px);}
  #feature-bar button.beyond{border-color:rgba(201,184,255,.6); color:#d8ccff; background:linear-gradient(135deg,rgba(120,80,255,.22),rgba(12,18,32,.82));}
  .planet-label.feature .name{border-color:rgba(103,232,249,.4); color:var(--cyan);}
  .planet-label.feature .dot{background:var(--cyan); box-shadow:0 0 8px 2px rgba(103,232,249,.7);}

  #hint{
    position:fixed; bottom:calc(16px + env(safe-area-inset-bottom)); left:18px; z-index:20; color:var(--muted);
    font-size:12px; letter-spacing:.02em; text-shadow:0 2px 8px rgba(0,0,0,.8);
  }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; top:72px; left:50%; transform:translateX(-50%) translateY(-8px);
    background:var(--panel); border:1px solid var(--border); border-radius:999px;
    padding:9px 20px; font-size:13px; z-index:25; opacity:0; pointer-events:none;
    transition:all .25s ease; backdrop-filter:blur(10px);
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- Planet labels (overview) ---------- */
  #labels-layer{position:fixed; inset:0; pointer-events:none; z-index:15;}
  .planet-label{
    position:absolute; transform:translate(-50%,-50%); pointer-events:auto; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .planet-label .dot{
    width:6px; height:6px; border-radius:50%; background:var(--cyan);
    box-shadow:0 0 8px 2px rgba(103,232,249,.7);
  }
  .planet-label .name{
    font-size:11px; letter-spacing:.03em; color:var(--text);
    text-shadow:0 2px 6px rgba(0,0,0,.9); white-space:nowrap;
    background:rgba(4,7,14,.55); padding:2px 8px; border-radius:999px;
    border:1px solid rgba(255,255,255,.08); transition:all .15s ease;
  }
  .planet-label:hover .name{border-color:var(--cyan); color:var(--cyan);}
  .planet-label.hero .name{border-color:rgba(251,191,36,.55); color:var(--amber);}
  .planet-label.hero .dot{background:var(--amber); box-shadow:0 0 10px 3px rgba(251,191,36,.8);}
  .planet-label .cta{
    font-size:9px; color:var(--amber); letter-spacing:.05em; text-transform:uppercase;
    text-shadow:0 2px 6px rgba(0,0,0,.9); opacity:.9;
  }

  /* ---------- Knowledge card ---------- */
  #card-panel{
    position:fixed; right:22px; top:50%; transform:translateY(-50%) translateX(12px);
    width:min(360px, calc(100vw - 44px)); z-index:30;
    background:var(--panel-solid); border:1px solid var(--border); border-radius:18px;
    padding:20px 20px 18px; opacity:0; pointer-events:none; transition:all .25s ease;
    box-shadow:0 20px 60px rgba(0,0,0,.55);
  }
  #card-panel.show{opacity:1; transform:translateY(-50%) translateX(0); pointer-events:auto;}
  #card-panel .close{
    position:absolute; top:12px; right:14px; background:none; border:none; color:var(--muted);
    font-size:18px; cursor:pointer; line-height:1;
  }
  #card-panel .close:hover{color:var(--text);}
  #card-panel .icon{font-size:30px; margin-bottom:6px; display:block;}
  #card-canvas{display:block; width:100%; height:auto; border-radius:12px; margin-bottom:10px; background:#05070d; border:1px solid rgba(103,232,249,.18);}
  #card-canvas[hidden]{display:none;}
  #card-panel .kicker{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--cyan); margin:0 0 4px;}
  #card-panel h2{font-size:17px; margin:0 0 2px; color:var(--text);}
  #card-panel .question{font-size:13px; color:var(--amber); font-style:italic; margin:0 0 10px;}
  #card-panel p.body{font-size:13.5px; line-height:1.55; color:var(--text); margin:0 0 16px;}
  #speak-btn{
    display:inline-flex; align-items:center; gap:8px; background:linear-gradient(135deg,#0e6a7a,#0a4a63);
    border:1px solid rgba(103,232,249,.4); color:#fff; padding:9px 16px; border-radius:999px;
    font-size:13px; cursor:pointer; transition:all .15s ease;
  }
  #speak-btn:hover{filter:brightness(1.15);}
  #speak-btn.speaking{background:linear-gradient(135deg,#fbbf24,#f59e0b); border-color:#fbbf24; color:#1a1300;}
  #card-panel .actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  #prev-btn, #next-btn{
    background:transparent; border:1px solid rgba(251,191,36,.5); color:var(--amber);
    padding:9px 16px; border-radius:999px; font-size:13px; cursor:pointer; font-family:inherit; transition:all .15s ease;
  }
  #prev-btn:hover, #next-btn:hover{background:rgba(251,191,36,.12);}
  #prev-btn[hidden], #next-btn[hidden]{display:none;}
  #link-btn{
    background:linear-gradient(135deg,rgba(120,80,255,.35),rgba(60,30,140,.35)); border:1px solid rgba(201,184,255,.6); color:#e6dcff;
    padding:9px 16px; border-radius:999px; font-size:13px; cursor:pointer; font-family:inherit; transition:all .15s ease;
  }
  #link-btn:hover{filter:brightness(1.2);}
  #link-btn[hidden]{display:none;}

  @media (max-width:640px){
    #title-bar{top:64px; font-size:12px; padding:8px 16px;}
    #crumbs{font-size:12px;}
    #crumbs button{padding:5px 9px; font-size:12px;}
    #lang-toggle button{padding:6px 10px; font-size:11px;}
    #facts-btn{bottom:58px; font-size:13px; padding:10px 18px;}
    #feature-bar{bottom:108px;}
    #feature-bar button{font-size:11px; padding:6px 10px;}
    #card-panel{
      right:10px; left:10px; width:auto; top:auto; bottom:14px; transform:translateY(20px);
    }
    #card-panel.show{transform:translateY(0);}
  }

  /* ---------- Touch devices: finger-sized targets ---------- */
  @media (pointer: coarse){
    #feature-bar button{font-size:14px; padding:10px 16px;}
    #facts-btn{font-size:15px; padding:13px 26px;}
    #crumbs button{font-size:14px; padding:9px 14px;}
    #lang-toggle button{font-size:14px; padding:9px 16px;}
    #speak-btn, #prev-btn, #next-btn, #link-btn{font-size:15px; padding:12px 20px;}
    #card-panel .close{font-size:24px; padding:8px;}
    .planet-label .name{font-size:13px; padding:4px 11px;}
    #hint{display:none;}
  }

  /* ---------- Small screens: one scrollable chip row, compact top bar ---------- */
  @media (max-width: 900px){
    #feature-bar{
      flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
      width:100vw; max-width:100vw; justify-content:flex-start; padding:4px 12px 6px;
      scrollbar-width:none; left:0; transform:none;
    }
    #feature-bar::-webkit-scrollbar{display:none;}
    #feature-bar button{flex:0 0 auto;}
    #feature-bar button:first-child{margin-left:auto;}
    #feature-bar button:last-child{margin-right:auto;}
  }
  @media (max-width: 700px){
    #title-bar{display:none !important;}
    #crumbs{max-width:calc(100vw - 150px); font-size:12px; padding:3px 6px 3px 3px;}
    #crumbs button{padding:6px 9px !important; font-size:12px !important;}
    #lang-toggle{padding:2px;}
    #lang-toggle button{padding:7px 10px !important; font-size:12px !important;}
    .planet-label .cta{display:none;}
    .planet-label .name{font-size:11px !important; padding:2px 8px !important;}
    #facts-btn{font-size:13px !important; padding:10px 18px !important;}
    #feature-bar button{font-size:12px !important; padding:8px 12px !important;}
  }

  /* ---------- Fade transition ---------- */
  #fade{position:fixed; inset:0; background:#000; z-index:90; opacity:0; pointer-events:none; transition:opacity .45s ease;}
  #fade.show{opacity:1;}
</style>
</head>
<body>

  <div id="loading">
    <div class="emoji">🪐</div>
    <h1>Solar System Explorer</h1>
    <p id="loading-text">Loading textures from deep space...</p>
    <div class="bar"><div class="bar-fill" id="loading-bar"></div></div>
  </div>

  <div id="scene-container"><canvas id="c"></canvas></div>
  <div id="labels-layer"></div>

  <div id="title-bar">
    <span class="main" id="title-main">🔭 Explore the Solar System</span>
    <span class="sub" id="title-sub"></span>
  </div>

  <nav id="crumbs" aria-label="Scale navigation"></nav>
  <div id="lang-toggle" role="group" aria-label="Language">
    <button type="button" data-lang="en" class="active">English</button>
    <button type="button" data-lang="zh">繁體中文</button>
  </div>
  <button id="facts-btn">✨ Fun Facts</button>
  <div id="feature-bar"></div>
  <div id="hint">🖱️ Drag to rotate · Scroll to zoom · Click a planet</div>
  <div id="toast"></div>

  <div id="card-panel">
    <button class="close" id="card-close">✕</button>
    <canvas id="card-canvas" width="320" height="150" hidden></canvas>
    <span class="icon" id="card-icon">🔴</span>
    <p class="kicker" id="card-kicker">Great Red Spot</p>
    <h2 id="card-title">The Great Red Spot</h2>
    <p class="question" id="card-question">Why is there a Great Red Spot?</p>
    <p class="body" id="card-text"></p>
    <div class="actions">
      <button id="speak-btn">🔊 <span id="speak-label">Listen</span></button>
      <button id="prev-btn" hidden>◀ Previous</button>
      <button id="next-btn" hidden>Next ▶</button>
      <button id="link-btn" hidden></button>
    </div>
  </div>

  <div id="fade"></div>

  <script src="https://unpkg.com/three@0.144.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.144.0/examples/js/controls/OrbitControls.js"></script>
  <script>if (location.protocol === 'file:') document.write('<script src="textures-data.js"><\/script>');</script>
  <script src="content.js"></script>
  <script src="audio/manifest.js"></script>
  <script src="app.js"></script>
</body>
</html>
